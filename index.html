<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dice Empire</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <main class="roller">
        <h1>Roll A Dice!</h1>
        <p>Take your chance!</p>

        <div class="controls">
            <label for="diceCount">Number of dice:</label>

            <select id="diceCount">
                <option value="1">One die</option>
                <option value="2">Two dice</option>
            </select>
        </div>

        <div class="controls">
            <label for="diceType">Dice type:</label>

            <select id="diceType">
                <option value="4">d4 — 4 sides</option>
                <option value="6" selected>d6 — 6 sides</option>
                <option value="8">d8 — 8 sides</option>
                <option value="12">d12 — 12 sides</option>
                <option value="20">d20 — 20 sides</option>
            </select>
        </div>

        <div id="diceContainer" class="dice-container"></div>

        <p id="result" aria-live="polite">
            Click the button to roll.
        </p>

        <button id="rollButton" type="button">
            Roll Dice
        </button>
        <section class="history">
        <h2>Recent rolls</h2>
        <p id="historyEmpty">No rolls yet.</p>
        <ol id="historyList"></ol>
        </section>
    </main>
</body>
</html>
