<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dice Empire</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <main class="roller">
        <h1>Roll A Dice!</h1>
        <p>Take your chance!</p>

        <div id="dice" class="dice" role="img" aria-label="Die showing 1">
        <span class="pip"></span>
        <span class="pip"></span>
        <span class="pip"></span>
        <span class="pip"></span>
        <span class="pip"></span>
        <span class="pip"></span>
        <span class="pip"></span>
        <span class="pip"></span>
        <span class="pip"></span>
        </div>

        <p id="result" aria-live="polite">
            Click the button to roll.
        </p>

        <button id="rollButton" type="button">
            Roll Dice
        </button>
    </main>
</body>
</html>
